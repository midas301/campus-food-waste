services:
  mysql:
    image: mysql:8
    container_name: cfw-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: campus_food
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/sql:/docker-entrypoint-initdb.d
  mongo:
    image: mongo:7
    container_name: cfw-mongo
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db
volumes:
  mysql_data: {}
  mongo_data: {}
